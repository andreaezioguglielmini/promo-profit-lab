[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promolab"
version = "0.1.0"
description = "An AI agent that tells a delivery restaurant whether its promotions make money"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "anthropic>=1.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.5",
]

[project.optional-dependencies]
app = ["streamlit>=1.35", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
promolab = "promolab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
