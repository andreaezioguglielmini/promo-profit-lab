name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests app
      - run: pytest -q
      - name: Agent eval (scripted baseline, no API key needed)
        run: python -m promolab.evals --policy scripted --out /tmp/evals
